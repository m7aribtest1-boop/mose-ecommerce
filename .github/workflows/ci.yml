name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Swap datasource to SQLite (for tests & build)
        run: |
          sed -i 's/provider = "postgresql"/provider = "sqlite"/' prisma/schema.prisma
          sed -i 's|url      = env("mosa_DATABASE_URL_UNPOOLED")|url      = "file:./prisma/ci.db"|' prisma/schema.prisma
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed
        env:
          mosa_DATABASE_URL_UNPOOLED: "file:./prisma/ci.db"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          mosa_DATABASE_URL_UNPOOLED: "file:./prisma/ci.db"
